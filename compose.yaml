# Docker Compose for Development
version: '3.8'

services:
  # PostgreSQL for production (using SQLite for dev simplicity)
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: prism_hub
  #     POSTGRES_USER: prism_hub
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U prism_hub -d prism_hub"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USER: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - APP_NAME=Prism Hub
      - APP_VERSION=1.0.0
      - DEBUG=true
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./prism_hub.db
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/prism-hub
      - OIDC_CLIENT_ID=prism-hub-backend
      - OIDC_CLIENT_SECRET=secret
      - OIDC_AUDIENCE=prism-hub-api
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=gpt-4o-mini
      - LLM_BASE_URL=
      - LLM_API_KEY=
      - CORS_ORIGINS=["http://127.0.0.1:5173","http://localhost:5173"]
      - DEMO_MODE=true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - prism_hub_db:/app
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=/api

volumes:
  prism_hub_db:
  keycloak_data:
  # postgres_data: